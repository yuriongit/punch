name: Punch - API

on:
  push:
    branches: [main]
    paths-ignore: ['web/**']
  pull_request:
    branches: [main]
    paths-ignore: ['web/**']

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
