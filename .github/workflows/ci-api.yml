name: Punch - API
on:
  push:
    branches: [main]
    paths-ignore: ['web/**']
  pull_request:
    branches: [main]
    paths-ignore: ['web/**']
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - run: echo Lint
      - run: go build -v
      - run: go test -v